<!DOCTYPE html>
<html>

<video id="player" width="1000" height="600" controls>
    <source type="video/mp4">

    Your browser does not support the video tag.
</video>

<body>
    <script>
        const videos = [

            "http://192.168.1.28:8000/video1.mp4",
            "http://192.168.1.28:8000/video2.mp4",
            "assets/video3.mp4"];


        let index = 0;
        const player = document.getElementById("player");
        let currentVideo = videos[index];

        function start() {

            player.src = currentVideo;
            console.log(currentVideo);
            //  player.play();

        }
        start()

        function playNext() {




            index++;


            if (index >= videos.length) { index = 0; }

            let currentVideo = videos[index];
            console.log(currentVideo);

            fetch(currentVideo, {
                method: "HEAD"
            })
                .then(response => {
                    console.log(response.status);

                    if (response.ok) {

                        console.log("Video Exists");
                    } else {
                        console.log("Video does not exist");
                        playNext()
                        return
                    }
                });
            player.src = videos[index];
            player.play()

        }

        player.addEventListener("ended", playNext);

        // playNext();

    </script>
</body>




</html>
